<blank [pageTitle]="pageTitle()" [pageIcon]="pageIcon()" (changeStatusEvent)="changeStatus($event)"
  [status]="data().isActive" [loading]="loading()" size="col-md-6">
  <form #form="ngForm" formValidate class="admin-form" (ngSubmit)="save(form)">
    <div class="admin-card">
      <div class="card-header">
        <h6>
          <i class="bi bi-info-circle text-primary me-2"></i>Temel Bilgiler
        </h6>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label>Paket Adı (*)</label>
          <input type="text" class="form-control" [(ngModel)]="data().name" name="name" required />
          <div class="invalid-feedback">Geçerli bir paket adı giriniz!</div>
        </div>
        <div class="form-group mt-2">
          <label>Fiyat (*)</label>
          <input type="text" class="form-control" [(ngModel)]="data().price" name="price" mask="separator.2" thousandSeparator="." decimalMarker="," [required]="true">
          <div class="invalid-feedback">Geçerli bir fiyat giriniz!</div>
        </div>
        <div class="form-check form-switch mt-3">
          <input class="form-check-input" type="checkbox" id="isRecommended" [ngModel]="data().isRecommended"
            (ngModelChange)="changeRecommended($event)" name="isRecommended" />
          <label class="form-check-label" for="isRecommended">Önerilen Paket</label>
        </div>
        <div class="form-group mt-3">
          <label>Kapsamlar</label>
          <div class="d-flex gap-1">
            <input type="text" class="form-control" [(ngModel)]="coveragesInput" name="coverageInput"
              placeholder="Kapsam Ekle" />
            <button type="button" class="btn btn-outline-primary" (click)="addCoverage()">
              <i class="bi bi-plus-lg"></i>
            </button>
          </div>
          <div class="mt-2">
            @for(cov of data().coverages; track cov; let i = $index){
            <span class="badge bg-primary me-1">
              {{cov}} <i class="bi bi-x ms-1" style="cursor:pointer" (click)="removeCoverage(i)"></i>
            </span>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="form-group mt-2 d-flex justify-content-end">
      <button class="btn btn-primary">
        <i class="bi" [ngClass]="pageIcon()"></i>
        {{btnName()}}
      </button>
    </div>
  </form>
</blank>
