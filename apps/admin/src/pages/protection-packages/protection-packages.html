<grid pageTitle="Koruma Paketleri" endpoint="/rent/odata/protection-packages"
    [addOptions]="{url: '/protection-packages/add', permission: 'protection_package:create'}"
    [editOptions]="{url: '/protection-packages/edit', permission: 'protection_package:edit'}"
    [detailOptions]="{url: '/protection-packages/detail', permission: 'protection_package:view'}"
    [deleteOptions]="{url: '/rent/protection-packages', permission: 'protection_package:delete'}"
    [breadcrumbs]="breadcrumbs()" captionTitle="Koruma Paketi Listesi">
    
    <flexi-grid-column field="name" title="Paket Adı" />
    <flexi-grid-column field="price" title="Fiyat" textAlign="right" filterType="number" format="c" textAlign="right" symbol="₺"/>
    <flexi-grid-column field="isRecommended" title="Önerilen" filterType="boolean" [booleanData]="['Evet', 'Hayır']"
        textAlign="center" />
</grid>
